<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control-Capex - PEPs por CEGE</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Tu CSS -->
    <link rel="stylesheet" href="../style.css" />
</head>
<body>

    <div class="container">
        <!-- ===== HEADER CON MENÚ DE PESTAÑAS (CORREGIDO) ===== -->
        <header class="header">
            <div class="header-left">
                <h1><i class="fas fa-building"></i> Control-Capex</h1>
                <div class="subtitle">Gestión de proyectos por CEGE y POSPRE</div>
            </div>
            
            <div class="header-right" style="display: flex; align-items: center; gap: 15px;">
                
                <!-- MENÚ DE PESTAÑAS -->
                <nav class="nav-menu" style="display: flex; align-items: center; gap: 5px; border-right: 1px solid #e2e8f0; padding-right: 15px;">
                    <a href="../index.html" class="nav-item" data-page="dashboard">
                        <i class="fas fa-chart-pie"></i> Dashboard
                    </a>
                    <a href="oc.html" class="nav-item" data-page="oc">
                        <i class="fas fa-file-invoice"></i> Órdenes de Compra
                    </a>
                    <!-- Pestaña activa para PEPs -->
                    <a href="peps.html" class="nav-item active" data-page="peps">
                        <i class="fas fa-project-diagram"></i> PEPs por CEGE
                    </a>
                </nav>

                <!-- FILTROS CEGE -->
                <div class="filters" style="margin:0;">
                    <div class="filter-group">
                        <label style="margin-right: 4px;"><i class="fas fa-filter"></i> CEGE:</label>
                        <select id="filtroCEGE" style="padding: 4px 24px 4px 8px;">
                            <option value="todos">🌐 Todos los CEGE</option>
                            <!-- Ejemplos de CEGEs -->
                            <option value="0209A0Z861">0209A0Z861</option>
                            <option value="0209A0Z777">0209A0Z777</option>
                            <option value="0209A0Z999">0209A0Z999</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <!-- ===== KPI's (Cantidad de PEPs/POSPRE) ===== -->
        <div class="metrics-grid" id="metricsGrid">
            <div class="metric-card">
                <div class="label"><i class="fas fa-folder-open"></i> Cantidad de PEPs / POSPRE</div>
                <div class="value" id="totalPEPs">0</div>
                <div class="sub">Proyectos activos en este CEGE</div>
            </div>
        </div>

        <!-- ===== TABLA DE DETALLE DE PEPs ===== -->
        <div class="table-wrapper">
            <div class="table-header">
                <h2><i class="fas fa-list-ul"></i> Detalle de PEPs por CEGE</h2>
                <div class="table-actions">
                    <button class="btn btn-outline" id="btnExportar"><i class="fas fa-file-export"></i> Exportar</button>
                </div>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>CEGE (Código)</th>
                            <th>PEP / POSPRE</th>
                            <th>Real Ejecutado</th>
                            <th>Comprometido</th>
                            <th>Disponible</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPEPs">
                        <!-- Datos cargados por JavaScript -->
                        <tr>
                            <td colspan="5" class="px-4 py-8 text-center text-gray-400 italic">
                                Selecciona un CEGE para cargar sus PEPs.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ============================ -->
    <!--  LÓGICA JAVASCRIPT (EJEMPLO) -->
    <!-- ============================ -->
    <script>
        // Datos de ejemplo
        const dataPEPs = [
            { cege: '0209A0Z861', pospre: 'CL-RM-TR-MAC', real: 450000, comprometido: 800000, disponible: 1200000 },
            { cege: '0209A0Z861', pospre: 'CL-RM-SN-COC', real: 120000, comprometido: 200000, disponible: 300000 },
            { cege: '0209A0Z861', pospre: 'CL-RM-TR-FAC', real: 0, comprometido: 350000, disponible: 500000 },
            { cege: '0209A0Z777', pospre: 'CL-RM-TR-IPA', real: 1500000, comprometido: 0, disponible: 500000 },
            { cege: '0209A0Z777', pospre: 'CL-RM-EX-ELT', real: 50000, comprometido: 40000, disponible: 10000 },
            { cege: '0209A0Z999', pospre: 'CL-RM-SN-COC', real: 100000, comprometido: 50000, disponible: 50000 },
        ];

        function renderizarTabla(cegeSeleccionado) {
            const tbody = document.getElementById('tablaPEPs');
            
            const filtrados = cegeSeleccionado === 'todos' 
                ? dataPEPs 
                : dataPEPs.filter(item => item.cege === cegeSeleccionado);

            document.getElementById('totalPEPs').textContent = filtrados.length;

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-8 text-center text-gray-400 italic">No hay PEPs para este CEGE.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtrados.map(item => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-4 py-3 font-medium text-blue-600">${item.cege}</td>
                    <td class="px-4 py-3">${item.pospre}</td>
                    <td class="px-4 py-3 text-right font-mono">$ ${item.real.toLocaleString('es-CL')}</td>
                    <td class="px-4 py-3 text-right font-mono">$ ${item.comprometido.toLocaleString('es-CL')}</td>
                    <td class="px-4 py-3 text-right font-mono">$ ${item.disponible.toLocaleString('es-CL')}</td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const filtroCEGE = document.getElementById('filtroCEGE');
            renderizarTabla(filtroCEGE.value);

            filtroCEGE.addEventListener('change', function() {
                renderizarTabla(this.value);
            });
            
            // Iluminar pestaña activa
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.classList.remove('active');
                const link = item.getAttribute('href');
                if (link.includes('peps.html')) {
                    item.classList.add('active');
                }
            });
        });
    </script>

</body>
</html>
